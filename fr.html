  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const salt = b64(D.salt), iv = b64(D.iv), ct = b64(D.ct), mac = b64(D.mac);
  // Alle drei Sprachseiten teilen denselben Salt: einmal anmelden genügt für DE, FR und IT.
  const KEY = 'sj26-schluessel-' + D.salt;
  const box = s => ({ get(){ try { return s.getItem(KEY); } catch { return null; } },
                      set(v){ try { s.setItem(KEY, v); } catch {} },
                      del(){ try { s.removeItem(KEY); } catch {} } });
  let local, session;
  try { local = box(localStorage); session = box(sessionStorage); } catch { local = session = box({getItem(){return null},setItem(){},removeItem(){}}); }

  async function derive(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name:'PBKDF2', salt, iterations:D.iter, hash:'SHA-256' }, base, 512));
  }
  // Entschlüsselt und prüft; gibt den HTML-Text zurück oder null bei falschem Schlüssel
  async function decrypt(bits) {
    const macKey = await crypto.subtle.importKey('raw', bits.slice(32), { name:'HMAC', hash:'SHA-256' }, false, ['verify']);

  const toB64 = u => btoa(String.fromCharCode(...u));

  const saved = session.get() || local.get();
  if (saved) decrypt(b64(saved)).then(h => h ? show(h) : (session.del(), local.del())).catch(() => { session.del(); local.del(); });

  const f = document.getElementById('f'), btn = document.getElementById('btn'), err = document.getElementById('err');
  f.addEventListener('submit', async e => {

    try {

      const html = await decrypt(bits);

        session.set(toB64(bits));

    btn.disabled = false;
