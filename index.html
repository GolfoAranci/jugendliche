  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  const KEY = 'sj26-schluessel-' + D.salt;
  const box = s => ({ get(){ try { return s.getItem(KEY); } catch { return null; } },
                      set(v){ try { s.setItem(KEY, v); } catch {} },
                      del(){ try { s.removeItem(KEY); } catch {} } });

  async function derive(pw) {

  async function decrypt(bits) {
    const macKey = await crypto.subtle.importKey('raw', bits.slice(32), { name:'HMAC', hash:'SHA-256' }, false, ['verify']);

  const saved = session.get() || local.get();
